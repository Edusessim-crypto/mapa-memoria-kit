<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}svg{display:block}</style></head><body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="fundo" cx="50%" cy="38%" r="75%">
    <stop offset="0" stop-color="#0d2a39"/>
    <stop offset=".5" stop-color="#05121c"/>
    <stop offset="1" stop-color="#010409"/>
  </radialGradient>
  <radialGradient id="nucleo" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".12" stop-color="#e6fcff"/>
    <stop offset=".35" stop-color="#5fe1ff" stop-opacity=".55"/>
    <stop offset="1" stop-color="#5fe1ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="feixe" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5fe1ff" stop-opacity=".9"/>
    <stop offset="1" stop-color="#5fe1ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="borda" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9ff0ff" stop-opacity=".55"/>
    <stop offset=".5" stop-color="#5fe1ff" stop-opacity=".1"/>
    <stop offset="1" stop-color="#5fe1ff" stop-opacity=".3"/>
  </linearGradient>
  <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="brilhoForte" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="16" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="forma"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
</defs>
<g clip-path="url(#forma)">
  <rect x="100" y="100" width="824" height="824" fill="url(#fundo)"/>
  <!-- mesa holográfica -->
  <g transform="translate(512 720) scale(1 .3)" fill="none" stroke="#5fe1ff" stroke-width="3">
    <circle r="90" stroke-opacity=".38"/>
    <circle r="180" stroke-opacity=".3"/>
    <circle r="270" stroke-opacity=".2"/>
    <circle r="360" stroke-opacity=".12"/>
    <path stroke-opacity=".14" d="M-360 0H360M-311.8 -180L311.8 180M-180 -311.8L180 311.8M0 -360V360M180 -311.8L-180 311.8M311.8 -180L-311.8 180"/>
  </g>
  <!-- feixe de luz -->
  <rect x="507" y="470" width="10" height="250" fill="url(#feixe)" opacity=".85"/>
  <!-- órbitas -->
  <g fill="none" stroke="#5fe1ff" stroke-width="5" filter="url(#brilho)">
    <ellipse cx="512" cy="470" rx="290" ry="96" stroke-opacity=".95"/>
    <ellipse cx="512" cy="470" rx="290" ry="96" transform="rotate(60 512 470)" stroke-opacity=".6"/>
    <ellipse cx="512" cy="470" rx="290" ry="96" transform="rotate(-60 512 470)" stroke-opacity=".6"/>
  </g>
  <!-- anel de mira -->
  <circle cx="512" cy="470" r="150" fill="none" stroke="#9ff0ff" stroke-width="3" stroke-dasharray="4 14" opacity=".7"/>
  <g fill="none" stroke="#bff6ff" stroke-width="4" opacity=".85">
    <path d="M676.7 331.8A215 215 0 0 1 723.7 507.3"/>
    <path d="M347.3 608.2A215 215 0 0 1 300.3 432.7"/>
  </g>
  <!-- notas em órbita -->
  <g filter="url(#brilho)">
    <circle cx="239.5" cy="437.2" r="15" fill="#ffb648"/>
    <circle cx="774.8" cy="510.6" r="13" fill="#5fe1ff"/>
    <g transform="rotate(60 512 470)"><circle cx="412.8" cy="560.2" r="14" fill="#5fe1ff"/><circle cx="657" cy="386.9" r="11" fill="#eafaff"/></g>
    <g transform="rotate(-60 512 470)"><circle cx="239.5" cy="502.8" r="13" fill="#ffb648"/><circle cx="784.5" cy="437.2" r="12" fill="#9db4ff"/></g>
  </g>
  <!-- núcleo -->
  <circle cx="512" cy="470" r="185" fill="url(#nucleo)" filter="url(#brilhoForte)"/>
  <circle cx="512" cy="470" r="30" fill="#ffffff"/>
</g>
<rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="url(#borda)" stroke-width="3"/>
</svg>
</body></html>
